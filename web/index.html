<!DOCTYPE html>
<html lang="fr">
<head>
  <style>html,body{margin:0;background:#000000;height:100%;}</style>
  <!-- Marketing : / sans app|open|overlay → landing HTML (évite le boot Flutter / lag).
       Anciens liens /?auth=login|signup → landing HTML (modale Firebase), pas Flutter. -->
  <script>
    (function () {
      try {
        var q = window.location.search || '';
        var path = window.location.pathname || '/';
        var host = window.location.hostname || '';
        if (host === 'localhost' || host === '127.0.0.1') return;
        if (path !== '/' && path !== '') return;
        var hash = window.location.hash || '';
        var origin = window.location.origin || '';
        var authMatch = q.match(/[?&]auth=([^&]*)/i);
        var keepFlutter = /[?&](app|open|overlay)=/i.test(q);
        if (authMatch && !keepFlutter) {
          var mode = decodeURIComponent(authMatch[1] || 'login');
          window.location.replace(
            origin + '/landing.html?auth=' + encodeURIComponent(mode) + hash,
          );
          return;
        }
        if (keepFlutter) return;
        window.location.replace(origin + '/landing.html' + hash);
      } catch (e) {}
    })();
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Paychek — journal de trading, checklist, état mental et analyse de performance. Master the mind, Master the trade.">
  <meta id="paychek-robots" name="robots" content="index, follow">
  <link rel="canonical" href="https://paychek.pro/landing.html">
  <script>
    (function () {
      try {
        var q = window.location.search || '';
        if (q.indexOf('auth=') >= 0 || q.indexOf('overlay=') >= 0) {
          var m = document.getElementById('paychek-robots');
          if (m) m.setAttribute('content', 'noindex, nofollow');
          var c = document.querySelector('link[rel="canonical"]');
          if (c && c.parentNode) c.parentNode.removeChild(c);
        }
      } catch (e) {}
    })();
  </script>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Paychek">
  <meta property="og:title" content="Paychek — Journal de trading">
  <meta property="og:description" content="Journal de trading, checklist, état mental et performance.">
  <meta property="og:url" content="https://paychek.pro/">
  <meta property="og:image" content="https://paychek.pro/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paychek — Journal de trading">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paychek — Journal de trading</title>
  <link rel="manifest" href="manifest.json">
  <!-- Facebook Login (web) — App ID Meta = Android/iOS. SDK JS requis (Meta → Facebook Login → Settings). -->
  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '967493382672804',
        cookie: true,
        xfbml: true,
        version: 'v19.0'
      });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  <!-- Sign in with Apple (web) — Services ID pro.paychek.signin -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
</head>
<body>
  <div id="fb-root"></div>
  <div id="paychek-auth-boot" hidden style="display:none;position:fixed;inset:0;z-index:9999;background:#000;color:#e5e5e5;font-family:system-ui,sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
    <div style="width:28px;height:28px;border:2px solid #1f2937;border-top-color:#34d399;border-radius:50%;animation:paychek-spin .8s linear infinite;"></div>
    <p style="margin:0;font-size:13px;color:#9ca3af;">Paychek</p>
  </div>
  <style>@keyframes paychek-spin{to{transform:rotate(360deg)}}</style>
  <script>
    (function () {
      try {
        if ((location.search || '').indexOf('auth=') >= 0) {
          var el = document.getElementById('paychek-auth-boot');
          if (el) { el.hidden = false; el.style.display = 'flex'; }
        }
      } catch (e) {}
    })();
  </script>
  <noscript>
    <div style="max-width:42rem;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#e5e5e5;background:#000;">
      <h1 style="color:#fff;font-size:1.5rem;">Paychek — Journal de trading</h1>
      <p>Checklist, état mental, stratégie, calendrier et analyse de performance pour traders.</p>
      <p><a href="/landing.html" style="color:#3b82f6;">Découvrir Paychek</a></p>
    </div>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
